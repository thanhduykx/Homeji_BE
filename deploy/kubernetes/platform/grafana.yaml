apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: homeji-grafana
  ports:
    - name: ui
      port: 3000
    - name: otlp-http
      port: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeji-grafana
  template:
    metadata:
      labels:
        app: homeji-grafana
    spec:
      automountServiceAccountToken: false
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.39.0
          ports:
            - containerPort: 3000
            - containerPort: 4318
          startupProbe:
            exec:
              command: [test, -f, /tmp/ready]
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: dashboard
              mountPath: /otel-lgtm/grafana/conf/provisioning/dashboards/homeji.yaml
              subPath: homeji.yaml
              readOnly: true
            - name: dashboard
              mountPath: /otel-lgtm/homeji-dashboards/homeji.json
              subPath: homeji.json
              readOnly: true
      volumes:
        - name: dashboard
          configMap:
            name: homeji-grafana-dashboard
