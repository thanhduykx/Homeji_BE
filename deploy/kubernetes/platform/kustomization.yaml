apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homeji-local
resources:
  - ../local
  - ../../local-observability
  - kafka.yaml
  - grafana.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: homeji-api
      spec:
        template:
          spec:
            containers:
              - name: api
                env:
                  - name: BackgroundJobs__Enabled
                    value: "true"
                  - name: Kafka__RentalPublications__Enabled
                    value: "true"
                  - name: Kafka__RentalPublications__AnalyticsEnabled
                    value: "true"
                  - name: Kafka__RentalPublications__BootstrapServers
                    value: kafka:9092
                  - name: Telemetry__Enabled
                    value: "true"
                  - name: OTEL_EXPORTER_OTLP_PROTOCOL
                    value: http/protobuf
                  - name: OTEL_EXPORTER_OTLP_ENDPOINT
                    value: http://grafana:4318
                  - name: OTEL_METRIC_EXPORT_INTERVAL
                    value: "5000"
