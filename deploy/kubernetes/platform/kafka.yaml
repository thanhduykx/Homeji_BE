apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: homeji-kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: homeji-kafka
  template:
    metadata:
      labels:
        app: homeji-kafka
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_HEAP_OPTS
              value: -Xms128m -Xmx384m
          startupProbe:
            tcpSocket:
              port: broker
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: homeji-kafka-topic
spec:
  activeDeadlineSeconds: 180
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: create-topic
          image: apache/kafka:4.4.0
          env:
            - name: KAFKA_HEAP_OPTS
              value: -Xms64m -Xmx192m
          command: [/bin/sh, -ec]
          args:
            - >-
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --command-config /dev/null
              --create --if-not-exists --topic homeji.rental-publications.v1 --partitions 1 --replication-factor 1;
              do sleep 3; done
