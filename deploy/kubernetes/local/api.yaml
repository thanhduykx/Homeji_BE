apiVersion: v1
kind: Service
metadata:
  name: homeji-api
spec:
  selector:
    app: homeji-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeji-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeji-api
  template:
    metadata:
      labels:
        app: homeji-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: [sh, -c, 'until pg_isready -h postgres -U homeji -d homeji_local; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: homeji-api:local-platform
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Staging
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homeji-local-db
                  key: password
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres;Database=homeji_local;Username=homeji;Password=$(POSTGRES_PASSWORD);Timeout=3
            - name: Database__ApplyMigrationsOnStartup
              value: "true"
            - name: BackgroundJobs__Enabled
              value: "false"
            - name: Supabase__ProjectUrl
              value: https://local-demo.invalid
            - name: Supabase__Audience
              value: authenticated
            - name: Email__Provider
              value: Smtp
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
