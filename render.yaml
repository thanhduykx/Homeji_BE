services:
  - type: web
    name: homeji-be
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Same value as PROXY_SHARED_SECRET on the frontend; lets the API rate limit by visitor.
      - key: RateLimiting__ProxySecret
        sync: false
      - key: Giphy__ApiKey
        sync: false
      - key: VoiceCalls__Provider
        value: Metered
      - key: VoiceCalls__Metered__AppName
        sync: false
      - key: VoiceCalls__Metered__ApiKey
        sync: false
      - key: Email__Provider
        value: Brevo
      - key: Email__Brevo__ApiKey
        sync: false
      - key: Email__Brevo__FromEmail
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: Kafka__RentalPublications__Enabled
        value: "true"
      - key: Kafka__RentalPublications__AnalyticsEnabled
        value: "true"
      - key: Telemetry__Enabled
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Ai__Gemini__ApiKey
        sync: false
      # Frontend origin migration: keep runtime overrides aligned with appsettings.
      - key: Supabase__RegistrationRedirectUrl
        value: https://homeji.onrender.com/auth/callback
      - key: Supabase__PasswordResetRedirectUrl
        value: https://homeji.onrender.com/reset-password
      - key: Supabase__GoogleRedirectUrl
        value: https://homeji.onrender.com/auth/callback
      - key: Payments__Redirects__FrontendPaymentUrl
        value: https://homeji.onrender.com/payments
      - key: Payments__PayPalSandbox__Enabled
        value: "true"
      - key: Payments__PayPalSandbox__GooglePayEnabled
        value: "true"
      - key: Payments__PayPalSandbox__FrontendOrigin
        value: https://homeji.onrender.com
      - key: Payments__PayPalSandbox__ClientId
        sync: false
      - key: Payments__PayPalSandbox__ClientSecret
        sync: false
      - key: Payments__PayPal__Enabled
        value: "true"
      - key: Payments__PayPal__Mode
        value: Sandbox
      - key: Payments__PayPal__GooglePayEnabled
        value: "true"
      - key: Payments__PayPal__ApplePayEnabled
        value: "true"
      - key: Payments__PayPal__FrontendOrigin
        value: https://homeji.onrender.com
      - key: Payments__PayPal__ClientId
        sync: false
      - key: Payments__PayPal__ClientSecret
        sync: false
