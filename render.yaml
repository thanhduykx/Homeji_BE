services:
  - type: web
    name: homeji-be
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Email__Provider
        value: Brevo
      - key: Email__Brevo__ApiKey
        sync: false
      - key: Email__Brevo__FromEmail
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Ai__Gemini__ApiKey
        sync: false
