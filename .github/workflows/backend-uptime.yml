name: Backend uptime

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: backend-uptime
  cancel-in-progress: false

jobs:
  health:
    name: Check Render liveness
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request backend liveness
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --fail \
            --proto '=https' \
            --connect-timeout 10 \
            --max-time 90 \
            --retry 1 \
            --retry-delay 5 \
            --retry-max-time 185 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            https://homeji-be.onrender.com/health/live)"
          if [[ "$status" != "200" || "$(cat "$response_file")" != "Healthy" ]]; then
            echo "::error::Backend liveness did not return HTTP 200 with Healthy."
            exit 1
          fi
          echo "Backend liveness: HTTP 200, Healthy."
